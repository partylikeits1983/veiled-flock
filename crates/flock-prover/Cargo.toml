[package]
name = "flock-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Apple-silicon-optimized end-to-end prover for Flock (R1CS over GF(2))."

[features]
# Forwarded to flock-core. See that crate's manifest for semantics.
hash-count = ["flock-core/hash-count"]
unsound-challenger = ["flock-core/unsound-challenger"]
zk = ["flock-core/zk"]
veil = ["zk", "dep:veil-f128"]
symbolic = ["flock-core/symbolic"]

[dependencies]
flock-core = { path = "../flock-core" }
rayon = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
veil-f128 = { path = "../veil-f128", optional = true }

[dev-dependencies]
# Tests, benches, and examples use the insecure `RandomChallenger`, gated in
# flock-core behind its `unsound-challenger` feature. Enabling it dev-only makes
# it available to test/bench/example builds without leaking into normal builds.
flock-core = { path = "../flock-core", features = ["unsound-challenger"] }
# Software Keccak-256 for the native chain benchmark.
sha3 = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "veiled_flock"
path = "src/bin/veiled_flock.rs"
required-features = ["veil"]

[[bench]]
name = "keccak_native_chain"
harness = false

[[bench]]
name = "blake3_native_chain"
harness = false

[[bench]]
name = "veil_vs_flock"
harness = false
required-features = ["veil"]

[[example]]
name = "chain_bench"
required-features = ["unsound-challenger"]

[lints]
workspace = true
