[package]
name = "flock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Protocol library and verifier for the Flock R1CS-over-GF(2) PIOP."

[features]
default = ["std", "parallel"]
std = [
    "blake3/std",
    "getrandom?/std",
    "serde/std",
    "sha2/asm",
    "sha2/std",
    "dep:toml",
]
parallel = ["dep:rayon"]
wasm = ["zk"]
os-rng = ["dep:getrandom"]

# Count hash invocations (SHA-256 Merkle leaf/pair compressions, FS BLAKE3
# absorption, PoW SHA-256) via global relaxed atomics. Off by default; used
# by flock-prover's benches/verifier_hash_count.rs.
hash-count = []

# Compile the insecure `RandomChallenger` (no Fiat-Shamir binding) into a
# non-test build. Off by default so real proofs *cannot* reference it — see
# `src/challenger.rs`. The crate's own `#[cfg(test)]` code gets it for free;
# this feature only exists for bench/example isolation (e.g. flock-prover's
# `chain_bench` example). NEVER enable it for a build that produces real proofs.
unsound-challenger = []

# Zero-knowledge mode: hiding commitments (per-lane mask block + blinder
# codeword), randomizer-witness layouts, and the prover-side DRBG that feeds
# them. Off by default; the non-zk paths are byte-identical with the feature
# disabled.
zk = []

# Exact symbolic execution used to generate and reverify ZK theorem
# artifacts. This is not needed by production provers or verifiers.
symbolic = []

[dependencies]
rayon = { workspace = true, optional = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
toml = { workspace = true, optional = true }
getrandom = { version = "0.2", default-features = false, optional = true }
libm = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
# Used by `LigeritoSecurityConfig` serde round-trip tests.
serde_json = { workspace = true }

[lints]
workspace = true
