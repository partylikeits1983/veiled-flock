[package]
name = "blake3-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "End-to-end BLAKE3 proving benchmark over both veil-f128 backends."
publish = false

# No direct flock-core dep: flock-prover re-exports it wholesale (`pub use
# flock_core::*`), and the `zk` feature must arrive through flock-prover's
# `veil` feature to keep feature unification correct.
# No `unsound-challenger` feature: `FsChallenger` serves every benched path.
# The generic harness (timer, CLI, rows, run driver) comes from
# `bench-harness`; this crate keeps only BLAKE3 domain code.
[dependencies]
bench-harness = { path = "../harness" }
flock-prover = { path = "../../crates/flock-prover", features = ["veil"] }
blake3 = { workspace = true }

# Criterion owns only the stage-timing target (benches/blake3_criterion.rs).
# `default-features = false` keeps plotters and rayon out of `make test
# --all-features`; `cargo_bench_support` must stay ON — without it a
# criterion target cannot run under `cargo bench` at all. Pin checked
# 2026-08-25: criterion 0.8.2, default features = ["rayon", "plotters",
# "cargo_bench_support"].
[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Keep libtest's default bench harness off the lib so `cargo bench -- <args>`
# reaches only the criterion target.
[lib]
bench = false

# Bins default `bench = true`; without `bench = false` cargo bench's
# `--save-baseline` would also hit this bin's libtest harness and fail
# (same rationale as [lib] bench = false). The bin keeps `test` on: the
# e2e logic (sweeps, rows) lives here with its unit tests.
[[bin]]
name = "blake3_e2e"
path = "src/blake3.rs"
bench = false

[[bench]]
name = "blake3_criterion"
path = "benches/blake3_criterion.rs"
harness = false

[lints]
workspace = true
