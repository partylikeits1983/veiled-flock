# Full executable Rust ZK certificate suite. It runs weekly and on demand; the
# ordinary Rust checks remain mandatory in the main CI workflow.

name: ZK certificates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

jobs:
  certificates:
    name: Exact certificates (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: 16cpu-linux-arm64
            rustflags: -C target-cpu=native
    runs-on:
      [
        runs-on,
        "runner=${{ matrix.runner }}",
        spot=false,
        "run-id=${{ github.run_id }}",
      ]
    timeout-minutes: 360
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Get stable toolchain date (cache key)
        id: rust-version
        shell: bash
        run: |
          STABLE_DATE=$(curl -sS https://static.rust-lang.org/dist/channel-rust-stable-date.txt)
          echo "date=$STABLE_DATE" >> $GITHUB_OUTPUT

      - name: rust-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.rustup/
            target/
          key: flock-cert-${{ runner.arch }}-${{ runner.os }}-${{ steps.rust-version.outputs.date }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            flock-cert-${{ runner.arch }}-${{ runner.os }}-${{ steps.rust-version.outputs.date }}-

      - name: Install Rust (stable)
        shell: bash
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable
          rustup default stable
          rustc --version

      - name: Run certificates
        run: scripts/zk-certify.sh

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: zk-certificate-manifest-${{ matrix.arch }}
          path: zk-certify-manifest.txt
