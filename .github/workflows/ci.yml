name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Test
        run: make test

  lean:
    name: Lean
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6

      - name: Build and independently check Lean proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          leanchecker: true
          use-mathlib-cache: true

      - name: Install Rust
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Audit theorem axioms
        run: cargo run --locked --release -p formal-proof -- audit
