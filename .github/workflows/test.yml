# Test gate for the zk feature + Lean proofs. Runner scheme follows lint.yml.
#
# The zk feature is security-critical and is NOT a default feature, so the
# lint workflow never compiles it; this workflow is what keeps the zk code
# type-checked, linted, and its fast test set green. The expensive exact
# certificates are in zk-certificates.yml (scheduled / manual).

name: Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-zk:
    name: Test zk (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: 16cpu-linux-arm64
            rustflags: -C target-cpu=native
          - arch: x86_64-avx512
            runner: 16cpu-linux-x64
            rustflags: -C target-cpu=znver4
    runs-on:
      [
        runs-on,
        "runner=${{ matrix.runner }}",
        spot=false,
        "run-id=${{ github.run_id }}",
      ]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Get stable toolchain date (cache key)
        id: rust-version
        shell: bash
        run: |
          STABLE_DATE=$(curl -sS https://static.rust-lang.org/dist/channel-rust-stable-date.txt)
          echo "date=$STABLE_DATE" >> $GITHUB_OUTPUT

      - name: rust-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.rustup/
            target/
          key: flock-test-${{ runner.arch }}-${{ runner.os }}-${{ steps.rust-version.outputs.date }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            flock-test-${{ runner.arch }}-${{ runner.os }}-${{ steps.rust-version.outputs.date }}-

      - name: Install Rust (stable + rustfmt + clippy)
        shell: bash
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          rustc --version && cargo clippy --version

      - name: cargo clippy (zk feature)
        run: cargo clippy --release --workspace --all-targets --features zk -- -D warnings

      - name: cargo test (zk feature, fast set)
        # Ignored tests are the offline exact certificates and the m=22
        # end-to-end runs; they are executed by zk-certificates.yml via
        # scripts/zk-certify.sh.
        run: cargo test --release --workspace --features zk

  lean:
    name: Lean proofs (build + axiom audit)
    runs-on:
      [
        runs-on,
        "runner=16cpu-linux-x64",
        spot=false,
        "run-id=${{ github.run_id }}",
      ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: lean-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.elan/
            lean/.lake/
          key: flock-lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
          restore-keys: |
            flock-lean-${{ runner.os }}-

      - name: Install elan
        shell: bash
        run: |
          if ! command -v elan &> /dev/null; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi

      - name: lake build
        working-directory: lean
        run: |
          lake exe cache get
          lake build

      - name: Axiom audit (standard axioms only, no sorry)
        run: scripts/lean-axioms.sh
